<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean of Memories 🌊</title>
    <link rel="icon" type="image/png" href="Image/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Kavivanar&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --deep-bg: #050816;
            --royal-blue: #2563EB;
            --neon-blue: #38BDF8;
            --soft-glow: #7DD3FC;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            background-color: var(--deep-bg);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        body.loaded {
            opacity: 1;
        }

        /* Subtle Background Overlay */
        .ambient-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; height: 80vh;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .back-btn {
            position: fixed;
            top: 40px;
            left: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--soft-glow);
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.4s ease;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            background: rgba(37, 99, 235, 0.2);
            border-color: var(--neon-blue);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
        }

        .header {
            text-align: center;
            padding: 100px 20px 20px 20px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--text-primary);
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        .header p {
            font-family: 'Kavivanar', cursive;
            font-size: 1.4rem;
            color: var(--neon-blue);
        }

        /* Glass Marquee */
        .marquee-container {
            width: 100%;
            margin: 60px 0;
            overflow: hidden;
            padding: 40px 0;
            background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.05), transparent);
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .image-wrapper {
            display: flex;
            width: max-content;
            gap: 40px;
            animation: scroll-left 60s linear infinite;
        }

        .image-wrapper:hover {
            animation-play-state: paused;
        }

        .glow-frame {
            position: relative;
            width: 250px;
            height: 500px;
            border-radius: 20px;
            padding: 4px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float-up-down 6s ease-in-out infinite;
        }

        @keyframes float-up-down {
            0%, 100% { top: 0px; }
            50% { top: -15px; }
        }

        .glow-frame::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 0%, transparent 40%, var(--neon-blue) 50%, var(--soft-glow) 55%, #fff 60%, transparent 70%, transparent 100%);
            animation: spin-border 4s linear infinite;
            z-index: -2;
        }

        .glow-frame::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            z-index: -1;
        }

        .glow-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            filter: grayscale(20%) brightness(0.9);
            transition: all 0.5s ease;
            position: relative;
            z-index: 2;
        }

        .glow-frame:hover {
            transform: scale(1.05) translateY(-15px);
            box-shadow: 0 25px 60px rgba(56, 189, 248, 0.4);
            z-index: 10;
        }

        .glow-frame:hover img {
            filter: grayscale(0%) brightness(1.1);
        }

        @keyframes spin-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Chat Section */
        .chat-container {
            max-width: 600px;
            margin: 40px auto 80px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 20px;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 15px 25px;
            border-radius: 20px;
            position: relative;
            font-size: 1.1rem;
            line-height: 1.5;
            backdrop-filter: blur(15px);
            color: var(--soft-glow);
            text-shadow: 0 0 8px rgba(125, 211, 252, 0.4);
            animation: float-up-down 6s ease-in-out infinite alternate;
        }

        .chat-bubble p {
            margin: 0;
        }

        .chat-bubble .time {
            display: block;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            margin-top: 8px;
            text-align: right;
        }

        .chat-bubble.left {
            align-self: flex-start;
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(125, 211, 252, 0.2);
            border-left: 3px solid var(--neon-blue);
            border-bottom-left-radius: 5px;
            box-shadow: -5px 10px 20px rgba(37, 99, 235, 0.3), inset 0 0 15px rgba(37, 99, 235, 0.1);
        }

        .chat-bubble.right {
            align-self: flex-end;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(125, 211, 252, 0.2);
            border-right: 3px solid var(--neon-blue);
            border-bottom-right-radius: 5px;
            box-shadow: 5px 10px 20px rgba(56, 189, 248, 0.2), inset 0 0 15px rgba(56, 189, 248, 0.1);
        }

        @media (max-width: 991px) {
            .header h1 { font-size: 3rem; }
            .glow-frame { width: 220px; height: 440px; }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.5rem; }
            .header p { font-size: 1.2rem; }
            .back-btn { top: 20px; left: 20px; font-size: 0.9rem; padding: 10px 15px; }
            .marquee-container { padding: 20px 0; margin: 30px 0; }
            .glow-frame { width: 180px; height: 360px; }
            .chat-bubble { font-size: 1rem; padding: 12px 15px; }
            .image-wrapper { gap: 20px; }
        }

        @media (max-width: 480px) {
            .header { padding: 80px 15px 15px 15px; }
            .header h1 { font-size: 2rem; }
            .header p { font-size: 1rem; }
            .back-btn { top: 15px; left: 15px; font-size: 0.8rem; padding: 8px 12px; }
            .glow-frame { width: 140px; height: 280px; }
            .chat-bubble { max-width: 95%; font-size: 0.95rem; }
        }

        /* Cinematic Footer */
        .cinematic-footer {
            position: relative;
            padding: 30px 0 20px 0;
            text-align: center;
            border-top: 1px solid rgba(125, 211, 252, 0.1);
            background: linear-gradient(to top, rgba(5, 8, 22, 1) 0%, rgba(5, 8, 22, 0) 100%);
            margin-top: 50px;
            z-index: 10;
        }

        .cinematic-footer p {
            font-family: var(--font-body);
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin: 0;
            text-shadow: 0 0 5px rgba(56, 189, 248, 0.3);
        }

        .cinematic-footer .footer-glow {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 10px;
            background: var(--neon-blue);
            filter: blur(20px);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <!-- Background Audio -->
    <audio id="bg-music" loop autoplay>
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <div class="ambient-glow"></div>

    <a href="index.html" class="back-btn"><i class="bi bi-arrow-left"></i> Return to Universe</a>
    
    <div class="header">
        <h1>Ocean of Memories</h1>
        <p>நினைவுகளின் காட்சியகம்</p>
    </div>

    <div class="marquee-container">
        <div class="image-wrapper" id="image-wrapper">
            <!-- Images injected via JS -->
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-bubble left" style="animation-delay: 0s;">
            <p>Every picture here holds a piece of my heart 💙</p>
            <span class="time">11:11 PM</span>
        </div>
        <div class="chat-bubble right" style="animation-delay: 1.5s;">
            <p>I can't wait to make a million more memories with you ✨</p>
            <span class="time">11:12 PM</span>
        </div>
    </div>

    <!-- Cinematic Footer -->
    <footer class="cinematic-footer">
        <div class="content-wrapper text-center">
            <p class="tamil-text" style="font-size: 1.1rem; color: rgba(255, 255, 255, 0.6); margin: 0; text-shadow: 0 0 5px rgba(56, 189, 248, 0.3);">முழுக்க முழுக்க பிரீத்தாவுக்காக உருவாக்கப்பட்டது 💙</p>
            <div class="footer-glow"></div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => document.body.classList.add('loaded'), 100);

            // Audio Sync Logic
            const bgMusic = document.getElementById('bg-music');
            if (bgMusic) {
                bgMusic.volume = 0.4;
                const savedTime = localStorage.getItem('musicTime');
                if (savedTime) {
                    bgMusic.currentTime = parseFloat(savedTime);
                }
                
                setInterval(() => {
                    if (!bgMusic.paused) {
                        localStorage.setItem('musicTime', bgMusic.currentTime);
                    }
                }, 500);
            }

            const wrapper = document.getElementById('image-wrapper');
            const galleryImages = [
                '1.jpeg', '2.jpeg', '3.jpeg', '4.jpeg', '5.jpeg', 
                '6.jpeg', '7.jpeg', '8.jpeg', '9.jpeg', '10.jpeg', 
                '11.jpeg', '12.jpeg', '13.jpeg', '14.jpeg', '15.jpeg', '16.jpeg', 
                '17.jpeg', '18.jpeg', '19.jpeg', '20.jpeg', '21.jpeg', '22.jpeg'
            ];

            const infiniteImages = [...galleryImages, ...galleryImages];

            infiniteImages.forEach((imgName, index) => {
                const frame = document.createElement('div');
                frame.className = 'glow-frame';
                // Random float delay so they bob up and down asynchronously
                frame.style.animationDelay = `${(index % 5) * 1.5}s`;
                
                const shimmer = document.createElement('div');
                shimmer.className = 'shimmer-overlay';
                frame.appendChild(shimmer);
                
                const img = document.createElement('img');
                img.src = `Image/${imgName}`;
                img.alt = "Beautiful Memory";
                
                frame.appendChild(img);
                wrapper.appendChild(frame);
            });

            document.querySelector('.back-btn').addEventListener('click', (e) => {
                e.preventDefault();
                document.body.style.opacity = '0';
                setTimeout(() => window.location.href = 'index.html', 1000);
            });
        });
        
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                document.body.classList.add('loaded');
                document.body.style.opacity = '1';
            }
        });

        const bgMusic = document.getElementById('bg-music');
        let isMusicPlaying = false;
        document.body.addEventListener('click', () => {
            if (!isMusicPlaying) {
                bgMusic.volume = 0.4;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                }).catch(e => console.log("Audio play blocked: ", e));
            }
        }, { once: true });
    </script>
    <script src="anti-inspect.js"></script>
</body>
</html>
